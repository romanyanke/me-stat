name: update

# Каждую ночь: свежие теги из Tumblr, пересборка всех страниц, публикация на
# GitHub Pages. Раньше это делал крон на домашнем сервере.
on:
  schedule:
    # 23:00 UTC — это 02:00 по Москве. GitHub может задержать запуск на
    # десятки минут, если в эту минуту очередь загружена; для ночной сборки
    # это не имеет значения.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      posts:
        description: "Обновить теги этих постов: id через пробел"
        type: string
        default: ""
      full:
        description: "Полный обход блога, а не только новые посты"
        type: boolean
        default: false

# Публикация в Pages не терпит параллельных заездов, но и обрывать начатую
# сборку на полпути незачем — ручной запуск просто дождётся своей очереди.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Свой снапшот ttags держит в tmp/source.json и по нему считает, сколько
      # постов доспросить: без него это ~300 запросов каждую ночь, с ним — один.
      #
      # Префикс ключа именно source2-: кеши от 1.x лежат под source-, а формат
      # снапшота сменился и не конвертируется — на старом файле ttags падает
      # с кодом 1, а не просит обойти блог заново. Первый прогон с новым
      # префиксом кеша не найдёт и сделает полный обход, дальше как обычно.
      - name: Restore tags snapshot
        uses: actions/cache@v6
        with:
          path: tmp/source.json
          key: source2-${{ github.run_id }}
          restore-keys: source2-

      # Адреса превью копятся между прогонами: с этим кешем build-thumbs.mjs
      # доходит до первой уже известной страницы и останавливается, без него
      # обходит весь блог заново (~750 запросов к API).
      - name: Restore thumbs cache
        uses: actions/cache@v6
        with:
          path: tmp/thumbs.json
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      # Дельту ttags считает по числу постов, а не по датам, поэтому
      # переразметку старых постов он не замечает. Ночью это и не нужно —
      # у старых постов теги не меняются; после правки тегов через retag.mjs
      # прогон запускается руками, с id этих постов или с full=true.
      #
      # Здесь код 3 не прощается: если названные посты перечитать не удалось,
      # ручной запуск своей задачи не выполнил, и об этом надо узнать.
      - name: Refresh named posts
        if: inputs.posts != ''
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          POSTS: ${{ inputs.posts }}
        run: |
          echo "$POSTS" | grep -Eq '^[0-9][0-9 ]*$' || {
            echo "posts: только id через пробел" >&2
            exit 1
          }
          npx ttags post $POSTS

      # Повторы на пустых ответах, 5xx и обрывах ttags делает сам, поэтому
      # второй попытки с паузой тут больше нет. Код 3 — «прогон оборван на
      # полпути, снапшот сохранён, приходи позже»: бюджет запросов, лимит
      # Tumblr или вытесненный раннер. Публиковать то, что уже собрано, и
      # дождаться следующей ночи нормально, а вот падать из-за этого — нет.
      #
      # Размер страницы и бюджет заданы в ttags.config.json: 50 постов на запрос
      # и 350 запросов, то есть полный обход блога (~303 запроса) плюс запас на
      # повторы. Остаток часового лимита в 1000 забирает build-thumbs.mjs —
      # он тратит до 300 за прогон.
      - name: Fetch tags from Tumblr
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          # Пустая строка, когда обход обычный: у ночного запуска inputs нет вовсе.
          FULL: ${{ inputs.full && '--full' || '' }}
        run: npx ttags $FULL || [ $? -eq 3 ]

      - name: Build pages
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: html

      - id: deploy
        uses: actions/deploy-pages@v5
