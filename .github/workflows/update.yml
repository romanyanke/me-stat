name: update

# Каждую ночь: свежие теги из Tumblr, пересборка всех страниц, публикация на
# GitHub Pages. Раньше это делал крон на домашнем сервере.
on:
  schedule:
    # 23:00 UTC — это 02:00 по Москве. GitHub может задержать запуск на
    # десятки минут, если в эту минуту очередь загружена; для ночной сборки
    # это не имеет значения.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      posts:
        description: "Обновить теги этих постов: id через пробел"
        type: string
        default: ""
      full:
        description: "Полный обход блога, а не только новые посты"
        type: boolean
        default: false

# Публикация в Pages не терпит параллельных заездов, но и обрывать начатую
# сборку на полпути незачем — ручной запуск просто дождётся своей очереди.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Свой кеш ttags держит в tmp/source.json и по нему считает, сколько
      # постов доспросить: без кеша это 302 запроса каждую ночь, с ним — один.
      - name: Restore tags cache
        uses: actions/cache@v6
        with:
          path: tmp/source.json
          key: source-${{ github.run_id }}
          restore-keys: source-

      # Дельту ttags считает по числу постов, а не по датам, поэтому
      # переразметку старых постов он не замечает. Ночью это и не нужно —
      # у старых постов теги не меняются; после правки тегов через retag.mjs
      # прогон запускается руками, с id этих постов или с full=true.
      - name: Drop tags cache for a full crawl
        if: inputs.full
        run: rm -f tmp/source.json

      # Адреса превью копятся между прогонами: с этим кешем build-thumbs.mjs
      # доходит до первой уже известной страницы и останавливается, без него
      # обходит весь блог заново (~750 запросов к API).
      - name: Restore thumbs cache
        uses: actions/cache@v6
        with:
          path: tmp/thumbs.json
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      # ttags — сторонний CLI без повторов: на пустом ответе Tumblr он падает
      # с «Cannot read properties of null». Две попытки с паузой; больше нельзя,
      # каждая тратит ~300 запросов из часового лимита в 1000.
      # Названные посты перечитываются точечно (то же, что npm run post),
      # и только потом добираются новые.
      - name: Refresh named posts
        if: inputs.posts != ''
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          POSTS: ${{ inputs.posts }}
        run: |
          echo "$POSTS" | grep -Eq '^[0-9][0-9 ]*$' || {
            echo "posts: только id через пробел" >&2
            exit 1
          }
          npx ttags post $POSTS

      - name: Fetch tags from Tumblr
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
        run: |
          npx ttags && exit 0
          echo "первая попытка не удалась, ждём 5 минут" >&2
          sleep 300
          npx ttags

      - name: Build pages
        env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: html

      - id: deploy
        uses: actions/deploy-pages@v5
